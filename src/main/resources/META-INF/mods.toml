loaderVersion="[43,)"
license="All rights reserved"

[[mods]]
modId="story_engine"
version="${mod_version}"
displayName="Story Engine"
authors="Lorikowka"
description='''
Сюжетный движок для Minecraft (Forge 1.19.2).

Ветвящиеся диалоги и квесты описываются JSON и меняются на лету:
— журнал квестов с автоотслеживанием (локации, предметы, добыча блоков, убийства) и наградами;
— сюжетный чат с иконками NPC и эффектом печатной машинки;
— контекстные подсказки взаимодействия: HUD «[F] Действие», мировые кольца-маркеры у близких интерактиблов, фолбэк F на ванильное воздействие;
— интерфейс с кастомными PNG-текстурами и цветами из конфига, без пересборки мода.

Управление — команды под единым корнем /story. Работает без перезагрузки сервера.
'''

[[dependencies.story_engine]]
    modId="forge"
    mandatory=true
    versionRange="[43,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.story_engine]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.19.2,1.20)"
    ordering="NONE"
    side="BOTH"
